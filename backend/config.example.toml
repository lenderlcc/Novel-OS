# Copy to config.toml and replace these development-only placeholders.
# URLs must percent-encode reserved characters in credentials (e.g. @ -> %40).
# TOML does not expand $ or ${...}; environment variables are never read.
postgres_url = 'postgresql+psycopg://novel_os:change-me-local-only@127.0.0.1:55432/novel_os_dev'
test_database_url = 'postgresql+psycopg://novel_os:change-me-test-only@127.0.0.1:55433/novel_os_test'
log_level = "INFO"
db_connect_timeout = 2
db_statement_timeout_ms = 3000
db_pool_timeout = 3

# NOVEL-003 test/dev simulator. Keep false outside local development.
workflow_fake_executor_enabled = false

# NOVEL-004 independent worker; file configuration only, mock provider only.
agent_lease_seconds = 30
agent_heartbeat_seconds = 5
agent_poll_seconds = 1
agent_retry_seconds = 1
agent_mock_scenario = "SUCCESS"

# NOVEL-005: file configuration only. Default execution makes no external model calls.
agent_model_profile = "mock-default"
agent_execution_scope = "all"
# Optional: lower the existing task retry budget (1 disables automatic retries).
# agent_max_attempts = 1
# Manual diagnosis only: save returned output before parsing under .runtime/agent-output/.
# Files contain story data, are private, and are never exposed through an API.
agent_capture_outputs = false
# Opt in to the real provider by selecting "openai-structured" and filling the key locally.
# openai_api_key = "replace-in-your-ignored-config-only"

# Single-case Requirement evaluation. This does not enable the background worker.
requirement_smoke_profile = "openai-structured"
# To use Lingzhi, set requirement_smoke_profile = "lingzhi-requirement".
# Model gpt-5.6-sol and generation limits are in novel_os/providers/profiles.toml.
lingzhi_base_url = "https://lingzhi.agibot.com/v1"
# lingzhi_api_key = "replace-in-your-ignored-config-only"
# For the browser console's manual Requirement test, set:
# agent_model_profile = "lingzhi-requirement"
# agent_execution_scope = "requirement-only"
# agent_max_attempts = 1
# Start the independent Worker explicitly; it will consume already pending Requirements.
# To continue the existing workflow through Planning / Plan Review / approved-plan Writing:
# agent_model_profile = "lingzhi-structured"
# agent_execution_scope = "chapter-writing"
# agent_max_attempts = 1
# This enables paid calls for queued tasks. Human plan approval remains required.

# Pause Writing while manually testing Requirement -> Planning -> Plan Review:
# agent_model_profile = "lingzhi-structured"
# agent_execution_scope = "planning-only"
# agent_max_attempts = 1
# This is a worker rollout/debug scope, not a workflow gate. Restore chapter-writing
# before approving a Plan; the internal console disables approval while Writing is closed.
# Two automatic Plans per Brief/human directive; unresolved hard failures then block.
