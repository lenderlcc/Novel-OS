# Operational input + output ceilings, keyed by the actual provider/model.
# Keep generation-profile identity and historical lineage hashes unchanged.
# https://developers.openai.com/api/docs/models/gpt-4o-mini
[context_windows.openai]
"gpt-4o-mini-2024-07-18" = 128000

# Gateway ceiling may be lowered if its deployment imposes a smaller limit.
# https://developers.openai.com/api/docs/models/gpt-5.6-sol
[context_windows.lingzhi]
"gpt-5.6-sol" = 1050000

[[profiles]]
profile_id = "mock-default"
provider = "mock"
model = "mock-v1"
capabilities = ["text"]
structured_output = false
stream_support = false
timeout_seconds = 30
max_output_tokens = 4096
generation = { temperature = 0.2 }

# Opt-in Requirement evaluation only; background worker selection remains unchanged.
[[profiles]]
profile_id = "lingzhi-requirement"
provider = "lingzhi"
model = "gpt-5.6-sol"
capabilities = ["text", "structured_output"]
structured_output = true
stream_support = false
timeout_seconds = 120
max_output_tokens = 8192
# Reasoning models use provider defaults; no sampling temperature override.
generation = { }

# Full existing workflow, including planning, plan review and approved-plan writing.
# Separate identity preserves the historical Requirement-only profile and lineage.
[[profiles]]
profile_id = "lingzhi-structured"
provider = "lingzhi"
model = "gpt-5.6-sol"
capabilities = ["text", "structured_output"]
structured_output = true
stream_support = false
# Long-form Writing can legitimately exceed the Requirement/Planning latency.
# Keep one bounded request; retries still require explicit user action.
timeout_seconds = 300
max_output_tokens = 8192
generation = { }

[[profiles]]
profile_id = "openai-structured"
provider = "openai"
model = "gpt-4o-mini-2024-07-18"
capabilities = ["text", "structured_output"]
structured_output = true
stream_support = false
timeout_seconds = 30
max_output_tokens = 4096
generation = { temperature = 0.2 }

[[profiles]]
profile_id = "mock-writing"
provider = "mock"
model = "mock-v1"
capabilities = ["text"]
structured_output = false
stream_support = false
timeout_seconds = 90
max_output_tokens = 8192
generation = { temperature = 0.2 }

[[profiles]]
profile_id = "openai-writing"
provider = "openai"
model = "gpt-4o-mini-2024-07-18"
capabilities = ["text", "structured_output"]
structured_output = true
stream_support = false
timeout_seconds = 90
max_output_tokens = 8192
generation = { temperature = 0.2 }
